services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7-jammy
    container_name: codeanova-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - codeanova-network

  # Backend REST API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: codeanova-server
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/code_a_nova
      - JWT_SECRET=super_secret_jwt_key_code_a_nova_2026_xyz
      - CLIENT_URL=http://localhost:3000
      - EMAIL_SERVICE=gmail
      - EMAIL_USER=${EMAIL_USER:-codeanova.official@gmail.com}
      - EMAIL_PASS=${EMAIL_PASS:-}
    depends_on:
      - mongodb
    networks:
      - codeanova-network

  # Frontend Client Service (Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: codeanova-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - codeanova-network

volumes:
  mongo-data:
    driver: local

networks:
  codeanova-network:
    driver: bridge
